[package]
name = "sio2"
version = "0.1.1"
edition = "2024"

description = "A deterministic, zero-copy binary serialization library"
keywords = ["serialization", "no-std", "zero-copy", "binary", "encoding"]
categories = ["encoding", "no-std"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/baguettege/sio2"

[features]
default = ["std"]
alloc = ["sio2-core/alloc", "sio2-derive/alloc"]
std = ["alloc", "sio2-core/std"]
indexmap = ["alloc", "sio2-core/indexmap"]
hashbrown = ["alloc", "sio2-core/hashbrown"]

[dependencies]
sio2-core = { workspace = true }
sio2-derive = { workspace = true }
